name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tickzy_owner
          POSTGRES_PASSWORD: tickzy
          POSTGRES_DB: tickzy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickzy_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_OWNER_URL: postgres://tickzy_owner:tickzy@localhost:5432/tickzy_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Security scanning (T-112, SEC-13): secrets in any tracked file, known-vulnerable dependencies (high/critical
      # fail the build), and the SAST rules that run as part of lint (eslint-plugin-security, zero warnings allowed).
      - name: Secret scanning
        run: pnpm secrets
      - name: Dependency audit
        run: pnpm audit:deps
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
