<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tickzy — Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Primary" style="{{rootStyle}}">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 6px 0;">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);">
      <svg width="30" height="30" viewBox="0 0 32 32" role="img" aria-label="Tickzy">
        <rect x="0" y="0" width="32" height="32" rx="9" style="fill: var(--accent);"></rect>
        <path d="M8 11.5a1.5 1.5 0 0 1 1.5-1.5h13a1.5 1.5 0 0 1 1.5 1.5v2a2.5 2.5 0 0 0 0 5v2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 8 20.5v-2a2.5 2.5 0 0 0 0-5z" fill="#FFFFFF"></path>
        <path d="M18.5 10v12" stroke="var(--accent)" style="stroke: var(--accent);" stroke-width="1.6" stroke-dasharray="1.6 1.8"></path>
      </svg>
      <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em;">Tickzy</span>
    </a>
    <button type="button" aria-label="Collapse sidebar" style="width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16"></path><path d="M20 12H9"></path><path d="m13 7-5 5 5 5"></path></svg>
    </button>
  </div>

  <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; text-align: left;">
    <span style="width: 32px; height: 32px; flex: 0 0 32px; border-radius: 9px; background: #16C8C7; color: #062B2B; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">AC</span>
    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 13px; font-weight: 600;">Acme Cloud</span>
      <span style="font-size: 12px; color: var(--muted);">Support workspace</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted);"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg>
  </button>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <span style="padding: 0 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);">Support</span>
    <a href="Main.dc.html" style="{{s.overview}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
      <span style="flex: 1 1 auto;">Overview</span>
    </a>
    <a href="Inbox.dc.html" style="{{s.inbox}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l2 3h4l2-3h5"></path><path d="M5.5 5h13L21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6z"></path></svg>
      <span style="flex: 1 1 auto;">Inbox</span>
      <span style="min-width: 22px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--accent); color: #FFFFFF; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">24</span>
    </a>
    <a href="#" style="{{s.mine}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      <span style="flex: 1 1 auto;">My issues</span>
      <span style="min-width: 22px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">7</span>
    </a>
    <a href="#" style="{{s.accounts}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V7l6-4 6 4v14"></path><path d="M15 21V11h6v10"></path><path d="M3 21h18M7 9h4M7 13h4M7 17h4"></path></svg>
      <span style="flex: 1 1 auto;">Accounts</span>
    </a>
    <a href="#" style="{{s.problems}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17h.01"></path></svg>
      <span style="flex: 1 1 auto;">Problems</span>
      <span style="min-width: 22px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--danger-bg); color: var(--danger); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">2</span>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <span style="padding: 0 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);">AI &amp; automation</span>
    <a href="Agent.dc.html" style="{{s.agent}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"></path><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
      <span style="flex: 1 1 auto;">AI agent</span>
      <span style="height: 20px; padding: 0 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center;">Live</span>
    </a>
    <a href="#" style="{{s.knowledge}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5M8 7h7"></path></svg>
      <span style="flex: 1 1 auto;">Knowledge</span>
    </a>
    <a href="#" style="{{s.workflows}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"></rect><rect x="15" y="15" width="6" height="6" rx="1.5"></rect><path d="M9 6h4a3 3 0 0 1 3 3v6"></path></svg>
      <span style="flex: 1 1 auto;">Workflows</span>
    </a>
    <a href="#" style="{{s.analytics}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      <span style="flex: 1 1 auto;">Analytics</span>
    </a>
  </div>

  <div style="flex: 1 1 auto;"></div>

  <section aria-label="Connected channels" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border);">
    <span style="font-size: 12px; font-weight: 600;">Channels</span>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--success);"></span><span style="flex: 1 1 auto;">Slack Connect</span><span style="color: var(--muted);">86</span></div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--success);"></span><span style="flex: 1 1 auto;">Email</span><span style="color: var(--muted);">3</span></div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--success);"></span><span style="flex: 1 1 auto;">Chat widget</span><span style="color: var(--muted);">1</span></div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;"><span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box;"></span><span style="flex: 1 1 auto; color: var(--muted);">Microsoft Teams</span><a href="#" style="color: var(--accent-text); font-weight: 600; text-decoration: none;">Connect</a></div>
  </section>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <a href="#" style="{{s.settings}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>
      <span style="flex: 1 1 auto;">Settings</span>
    </a>
    <a href="#" style="{{s.help}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"></path></svg>
      <span style="flex: 1 1 auto;">Help &amp; docs</span>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","inbox","mine","accounts","problems","agent","knowledge","workflows","analytics","settings","help"],"default":"overview"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"color","options":["#5347CE","#4896FE","#16C8C7","#887CFD"],"default":"#5347CE"},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
  tokens(dark, accent) {
    var a = accent || '#5347CE';
    if (dark && a === '#5347CE') a = '#6B60EA';
    var t = dark ? {
      bg: '#0B0D14', surface: '#13161F', 'surface-2': '#1A1E2A', border: '#262B38', text: '#ECEEF5', muted: '#A0A7B8',
      'accent-soft': '#25224A', 'accent-text': '#B9B3FF', track: '#232838',
      'success-bg': '#0F2E2B', success: '#4FD8C6', 'danger-bg': '#3A1720', danger: '#FF8E9C', 'warn-bg': '#3A2A10', warn: '#F5B85A'
    } : {
      bg: '#F3F5F8', surface: '#FFFFFF', 'surface-2': '#F6F7FA', border: '#E5E7ED', text: '#111427', muted: '#5B6273',
      'accent-soft': '#EEEDFB', 'accent-text': '#4A3FC0', track: '#ECEEF3',
      'success-bg': '#E2F7F3', success: '#0B7468', 'danger-bg': '#FDECEE', danger: '#B4233A', 'warn-bg': '#FFF3DE', warn: '#8A5300'
    };
    var s = '--accent:' + a + ';';
    for (var k in t) s += '--' + k + ':' + t[k] + ';';
    return s;
  }
  renderVals() {
    var dark = this.props.theme === 'dark';
    var active = this.props.active || 'overview';
    var keys = ['overview', 'inbox', 'mine', 'accounts', 'problems', 'agent', 'knowledge', 'workflows', 'analytics', 'settings', 'help'];
    var base = 'display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:10px;font-size:14px;text-decoration:none;box-sizing:border-box;';
    var s = {};
    keys.forEach(function (k) {
      s[k] = base + (k === active
        ? 'background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--border);'
        : 'color:var(--muted);font-weight:500;');
    });
    return {
      s: s,
      rootStyle: this.tokens(dark, this.props.accent) + 'box-sizing:border-box;width:100%;min-height:100%;padding:18px 14px;display:flex;flex-direction:column;gap:22px;background:var(--surface);border-right:1px solid var(--border);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;'
    };
  }
}
</script>
</body>
</html>
