<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tickzy — Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="{{rootStyle}}">
  <label style="flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search</span>
    <input type="search" placeholder="Search issues, accounts, messages" style="flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 13px;">
    <kbd style="font-family: inherit; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted);">⌘K</kbd>
  </label>

  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
    <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 11px; border: 0; background: var(--accent); color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New issue
    </button>
    <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center;">
      <sc-if value="{{dark}}" hint-placeholder-val="{{false}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{light}}" hint-placeholder-val="{{true}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </sc-if>
    </button>
    <button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--surface);"></span>
    </button>
    <span style="width: 1px; height: 28px; background: var(--border); margin: 0 4px;"></span>
    <button type="button" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 4px; border-radius: 12px; border: 0; background: transparent; color: var(--text); font: inherit; text-align: left;">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">MC</span>
      <span style="display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 13px; font-weight: 600;">Maya Chen</span>
        <span style="font-size: 12px; color: var(--muted);">Support lead · Online</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted);"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"color","options":["#5347CE","#4896FE","#16C8C7","#887CFD"],"default":"#5347CE"},"onToggleTheme":{"editor":null},"$preview":{"width":1192,"height":72}}'>
class Component extends DCLogic {
  tokens(dark, accent) {
    var a = accent || '#5347CE';
    if (dark && a === '#5347CE') a = '#6B60EA';
    var t = dark ? {
      bg: '#0B0D14', surface: '#13161F', 'surface-2': '#1A1E2A', border: '#262B38', text: '#ECEEF5', muted: '#A0A7B8',
      'accent-soft': '#25224A', 'accent-text': '#B9B3FF', danger: '#FF8E9C'
    } : {
      bg: '#F3F5F8', surface: '#FFFFFF', 'surface-2': '#F6F7FA', border: '#E5E7ED', text: '#111427', muted: '#5B6273',
      'accent-soft': '#EEEDFB', 'accent-text': '#4A3FC0', danger: '#B4233A'
    };
    var s = '--accent:' + a + ';';
    for (var k in t) s += '--' + k + ':' + t[k] + ';';
    return s;
  }
  renderVals() {
    var st = this.state || {};
    var self = this;
    var dark = this.props.onToggleTheme ? this.props.theme === 'dark' : (st.dark !== undefined ? st.dark : this.props.theme === 'dark');
    return {
      dark: dark,
      light: !dark,
      toggleLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      toggle: function () {
        if (self.props.onToggleTheme) self.props.onToggleTheme();
        else self.setState({ dark: !dark });
      },
      rootStyle: this.tokens(dark, this.props.accent) + 'box-sizing:border-box;width:100%;min-height:72px;padding:14px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-bottom:1px solid var(--border);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;'
    };
  }
}
</script>
</body>
</html>
